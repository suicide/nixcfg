keys:
  - &psy age1t5s6sww06lq63fsv4kgd7mmf3eh9t9mmn9unaun3ue3awecljuaqm2jc82
  - &psy-mms age1fyh8reyks259t7k5kcvns0mm8n6vq0qm4eexyljv7m05ju6ztdmsud8c9d
creation_rules:
  # ordering is important here
  # psy-mac has an additional recipient (psy-mms)
  - path_regex: secrets/users/psy-mac\.yaml$
    key_groups:
    - age:
      - *psy
      - *psy-mms
  # General rule for all other secrets in the secrets/ tree
  - path_regex: secrets/(hosts/[a-zA-Z0-9\-]+\.yaml|users/[a-zA-Z0-9]+\.yaml|legacy\.yaml)$
    key_groups:
    - age:
      - *psy
